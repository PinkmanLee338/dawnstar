<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>晨星大陆 · Dawnstar — 竖屏3D MMORPG</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#060812;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:#e8e2d0}
#game{position:fixed;inset:0}
canvas{display:block}
.panel{background:linear-gradient(180deg,rgba(24,20,14,.96),rgba(12,10,8,.96));border:1px solid #8a6d2f;border-radius:10px;box-shadow:0 0 0 2px #1a1408,0 8px 30px rgba(0,0,0,.7)}
.gold{color:#ffd100}.dim{color:#a89e83}.red{color:#ff5a4e}.grn{color:#5be35b}.blu{color:#5db9ff}.pur{color:#c07dff}.gry{color:#cfcfcf}.org{color:#ff9d45}
button{font-family:inherit;cursor:pointer}
.btn{background:linear-gradient(180deg,#6d5518,#4a3a0e);border:1px solid #c9a227;color:#ffe9a8;border-radius:8px;padding:9px 18px;font-size:15px;font-weight:700;letter-spacing:1px}
.btn:active{transform:scale(.96)}
.btn:disabled{filter:grayscale(.8);opacity:.5}
.btn2{background:linear-gradient(180deg,#3a3f4d,#23262f);border:1px solid #6b7280;color:#dfe6f2;border-radius:8px;padding:8px 14px;font-size:14px}
/* ---------- 开始界面 ---------- */
#startScreen{position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:5vh 18px 20px;background:radial-gradient(120% 90% at 50% 0%,#1c2b52 0%,#0a0f24 55%,#04050c 100%);overflow-y:auto}
#startScreen h1{font-size:52px;letter-spacing:8px;color:#ffd100;text-shadow:0 0 24px rgba(255,180,0,.55),0 4px 0 #5a4300,0 8px 22px #000;margin-top:2vh}
#startScreen .sub{color:#9fc0ff;letter-spacing:6px;font-size:13px;margin:6px 0 2vh}
#nameInput{width:min(320px,86vw);padding:11px 14px;font-size:16px;border-radius:8px;border:1px solid #8a6d2f;background:#0d0f18;color:#ffe9a8;text-align:center;outline:none;margin-bottom:14px}
.clsRow{display:flex;gap:10px;width:min(430px,94vw);margin-bottom:16px}
.clsCard{flex:1;padding:12px 8px 10px;border-radius:10px;border:2px solid #3c4356;background:linear-gradient(180deg,#171b29,#0c0e16);text-align:center;cursor:pointer;transition:.15s}
.clsCard.sel{border-color:#ffd100;box-shadow:0 0 18px rgba(255,209,0,.35);background:linear-gradient(180deg,#2a2410,#141007)}
.clsCard .ic{font-size:34px;line-height:1.1}
.clsCard .nm{font-size:16px;font-weight:700;margin:4px 0 3px}
.clsCard .ds{font-size:11px;color:#a89e83;line-height:1.5}
#clsDesc{width:min(430px,94vw);min-height:64px;padding:10px 14px;font-size:13px;line-height:1.65;color:#d8cfb2;margin-bottom:16px}
#startBtns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
#bigStart{font-size:19px;padding:13px 42px}
#startTip{margin-top:16px;font-size:11.5px;color:#77809a;line-height:1.7;text-align:center;max-width:400px}
/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;z-index:50;pointer-events:none;display:none}
#hud>*{pointer-events:auto}
#playerFrame{position:absolute;top:calc(8px + env(safe-area-inset-top));left:8px;width:196px;padding:7px 9px 8px;border-radius:9px;background:linear-gradient(180deg,rgba(16,14,10,.88),rgba(8,8,8,.88));border:1px solid #8a6d2f}
#playerFrame .nm{font-size:13.5px;font-weight:700;display:flex;justify-content:space-between}
#playerFrame .nm .lv{color:#ffd100}
.bar{height:13px;border-radius:4px;background:#1c0505;border:1px solid #000;position:relative;overflow:hidden;margin-top:4px}
.bar>i{position:absolute;inset:0;transform-origin:left;background:linear-gradient(180deg,#7dff6a,#2fbf2f 55%,#1d8f1d);transition:transform .18s}
.bar.mp>i{background:linear-gradient(180deg,#6ab8ff,#2f7fbf 55%,#1d5f9f)}
.bar.xp{height:6px;background:#140f04}
.bar.xp>i{background:linear-gradient(180deg,#e6c8ff,#9d4dff)}
.bar span{position:absolute;inset:0;font-size:10px;line-height:13px;text-align:center;color:#fff;text-shadow:0 1px 2px #000;font-weight:700}
.bar.xp span{line-height:6px;font-size:0}
#resText{font-size:11px;color:#ffc44d;margin-top:3px;text-align:right;font-weight:700}
#targetFrame{position:absolute;top:calc(8px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);width:210px;padding:6px 9px 7px;border-radius:9px;background:linear-gradient(180deg,rgba(20,10,10,.88),rgba(8,8,8,.88));border:1px solid #7a4a3a;display:none}
#targetFrame .nm{font-size:12.5px;font-weight:700;display:flex;justify-content:space-between}
#targetFrame .bar{height:11px}.bar.hp2>i{background:linear-gradient(180deg,#ff8a7a,#d23c2a 55%,#96210f)}
#bossBar{position:absolute;top:calc(64px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);width:min(330px,80vw);padding:6px 10px 8px;border-radius:9px;background:rgba(30,4,4,.9);border:1px solid #a33;display:none;text-align:center}
#bossBar .nm{color:#ff8a7a;font-weight:800;font-size:14px;letter-spacing:2px}
#bossBar .bar{height:12px}
#topRight{position:absolute;top:calc(8px + env(safe-area-inset-top));right:8px;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
#minimap{width:104px;height:104px;border-radius:50%;border:2px solid #8a6d2f;background:#0a0d16;box-shadow:0 4px 14px rgba(0,0,0,.6)}
#sysBtns{display:flex;gap:5px}
.sysBtn{width:38px;height:38px;border-radius:9px;border:1px solid #8a6d2f;background:rgba(14,12,8,.9);color:#ffe9a8;font-size:18px;position:relative}
.sysBtn .bdg{position:absolute;top:-4px;right:-4px;background:#d23c2a;color:#fff;font-size:9px;min-width:15px;height:15px;border-radius:8px;line-height:15px;text-align:center;font-weight:800}
#zoneName{position:absolute;top:calc(122px + env(safe-area-inset-top));right:12px;font-size:11.5px;color:#cfd8ea;text-shadow:0 1px 3px #000;text-align:right}
#questTracker{position:absolute;top:calc(146px + env(safe-area-inset-top));right:8px;width:172px;padding:8px 9px;border-radius:9px;background:rgba(10,10,14,.72);border:1px solid rgba(138,109,47,.6);font-size:11.5px;line-height:1.55}
#questTracker h4{color:#ffd100;font-size:12px;margin-bottom:3px;letter-spacing:1px}
#questTracker .q{margin-bottom:5px}
#questTracker .q .t{color:#ffe9a8;font-weight:700}
#questTracker .q .p{color:#b9c4d6}
#questTracker .done{color:#5be35b}
#chatLog{position:absolute;left:8px;bottom:196px;width:min(250px,58vw);font-size:11px;line-height:1.5;color:#cfe0ff;text-shadow:0 1px 2px #000;pointer-events:none;max-height:118px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end}
#chatLog .w{color:#ffd100}#chatLog .s{color:#ff9d45}#chatLog .l{color:#8aff8a}
#chatLog div{opacity:.92}
#castBar{position:absolute;left:50%;bottom:188px;transform:translateX(-50%);width:min(280px,70vw);display:none;text-align:center}
#castBar .lb{font-size:12px;color:#ffe9a8;text-shadow:0 1px 3px #000;margin-bottom:3px;font-weight:700}
#castBar .bar{height:10px;background:#10131c}
#castBar .bar>i{background:linear-gradient(180deg,#ffe98a,#d8a41c);transition:none}
#toast{position:absolute;top:24%;left:50%;transform:translateX(-50%);text-align:center;pointer-events:none;width:94vw}
#toast .big{font-size:26px;font-weight:800;color:#ffd100;text-shadow:0 0 18px rgba(255,180,0,.6),0 2px 4px #000;letter-spacing:3px}
#toast .small{font-size:14px;color:#e8f2ff;text-shadow:0 1px 3px #000;margin-top:4px}
#lootToast{position:absolute;top:34%;left:50%;transform:translateX(-50%);text-align:center;pointer-events:none;font-size:13.5px;line-height:1.7;text-shadow:0 1px 3px #000}
/* 摇杆与技能 */
#joyBase{position:absolute;left:20px;bottom:calc(26px + env(safe-area-inset-bottom));width:118px;height:118px;border-radius:50%;background:rgba(255,255,255,.05);border:1.5px solid rgba(255,233,168,.35);pointer-events:none}
#joyStick{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe9a8,#8a6d2f 70%);box-shadow:0 3px 10px rgba(0,0,0,.6)}
#skillCluster{position:absolute;right:12px;bottom:calc(20px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(3,58px);gap:8px;align-items:end}
.sk{width:58px;height:58px;border-radius:50%;border:2px solid #8a6d2f;background:radial-gradient(circle at 35% 28%,#39415a,#141824 75%);color:#fff;font-size:23px;position:relative;overflow:hidden;box-shadow:0 4px 12px rgba(0,0,0,.55)}
.sk.big{width:70px;height:70px;font-size:29px;border-color:#c9a227}
.sk .cd{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.72);color:#ffe9a8;font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;pointer-events:none}
.sk .key{position:absolute;top:1px;left:5px;font-size:9px;color:#ffd100;font-weight:800;text-shadow:0 1px 2px #000}
.sk .cost{position:absolute;bottom:1px;right:5px;font-size:9px;color:#9fc0ff;font-weight:800;text-shadow:0 1px 2px #000}
.sk.locked{filter:grayscale(1);opacity:.45}
.sk:active{transform:scale(.93)}
.sk.pot{border-color:#7a3a3a;font-size:20px}
.sk.pot .cnt{position:absolute;bottom:1px;left:0;right:0;font-size:10.5px;color:#ffb0a8;font-weight:800;text-shadow:0 1px 2px #000}
#midBtns{position:absolute;right:16px;bottom:calc(178px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:9px}
.midBtn{width:52px;height:52px;border-radius:50%;border:1.5px solid #6b7280;background:rgba(16,18,26,.88);color:#dfe6f2;font-size:12px;font-weight:700;line-height:1.25}
.midBtn.hot{border-color:#ffd100;color:#ffd100;box-shadow:0 0 12px rgba(255,209,0,.4)}
#dmgLayer,#plateLayer{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.dmgTxt{position:absolute;font-weight:800;font-size:16px;color:#fff;text-shadow:0 0 4px #000,0 2px 2px #000;transform:translate(-50%,-50%);white-space:nowrap}
.dmgTxt.crit{font-size:22px;color:#ffd100}
.dmgTxt.player{color:#ff7a6e}.dmgTxt.heal{color:#6aff7a}.dmgTxt.miss{color:#b9c4d6;font-size:13px}
.plate{position:absolute;transform:translate(-50%,-100%);text-align:center;pointer-events:none;width:86px}
.plate .nm{font-size:10.5px;color:#fff;text-shadow:0 1px 2px #000,0 0 3px #000;white-space:nowrap;overflow:hidden}
.plate .nm .lv{color:#ffd100}
.plate .pb{height:5px;background:rgba(0,0,0,.65);border:1px solid rgba(0,0,0,.9);border-radius:2px;margin-top:1px;overflow:hidden}
.plate .pb>i{display:block;height:100%;background:#d23c2a}
.plate.friendly .pb>i{background:#2fbf2f}
.plate .mark{font-size:15px;color:#ffd100;font-weight:900;text-shadow:0 0 6px #000}
/* ---------- 面板 ---------- */
.sheet{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(400px,94vw);max-height:82vh;overflow-y:auto;z-index:120;padding:16px;display:none}
.sheet h3{color:#ffd100;letter-spacing:2px;font-size:17px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.sheet h3 .x{background:none;border:none;color:#a89e83;font-size:19px}
#bagGrid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:10px}
.slot{aspect-ratio:1;border-radius:7px;border:1.5px solid #444;background:#101218;display:flex;align-items:center;justify-content:center;font-size:21px;position:relative;cursor:pointer}
.slot .n{position:absolute;bottom:0;right:3px;font-size:10px;color:#fff;font-weight:800;text-shadow:0 1px 2px #000}
.slot.r1{border-color:#9d9d9d}.slot.r2{border-color:#1eff00}.slot.r3{border-color:#0070dd}.slot.r4{border-color:#a335ee}.slot.r5{border-color:#ff8000}
#moneyRow{font-size:14px;color:#ffd100;font-weight:700}
.eqRow{display:flex;gap:8px;margin-bottom:10px}
.eqSlot{flex:1;text-align:center;padding:8px 4px;border-radius:8px;border:1.5px solid #444;background:#101218;font-size:12px;line-height:1.5;min-height:64px}
.statGrid{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;font-size:13px;line-height:1.7}
.qItem{padding:9px 10px;border:1px solid #3c4356;border-radius:8px;margin-bottom:8px;background:rgba(255,255,255,.03)}
.qItem .t{font-weight:700;color:#ffe9a8;font-size:14px}
.qItem .d{font-size:12px;color:#b9c4d6;line-height:1.6;margin-top:2px}
.qItem .rw{font-size:12px;color:#8aff8a;margin-top:3px}
#dialogSheet .npcSay{font-size:14px;line-height:1.75;color:#e8e2d0;background:rgba(255,255,255,.04);border-left:3px solid #c9a227;padding:9px 12px;border-radius:0 8px 8px 0;margin-bottom:12px}
.dlgBtns{display:flex;flex-direction:column;gap:8px}
.dlgBtns .btn,.dlgBtns .btn2{width:100%;text-align:center}
.shopRow{display:flex;justify-content:space-between;align-items:center;padding:7px 4px;border-bottom:1px solid #2a2e3c;font-size:13.5px}
.shopRow button{padding:5px 13px;font-size:13px}
#talentSheet{text-align:center}
.talRow{display:flex;flex-direction:column;gap:9px;margin-top:6px}
.talCard{padding:13px;border-radius:10px;border:2px solid #3c4356;background:linear-gradient(180deg,#171b29,#0c0e16);cursor:pointer;text-align:left}
.talCard:active{border-color:#ffd100}
.talCard .t{font-size:15px;font-weight:800;color:#ffe9a8}
.talCard .d{font-size:12.5px;color:#b9c4d6;margin-top:3px;line-height:1.55}
#deathScreen{position:fixed;inset:0;z-index:150;background:rgba(10,0,0,.78);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px}
#deathScreen h2{color:#ff5a4e;font-size:34px;letter-spacing:6px;text-shadow:0 0 20px rgba(255,0,0,.5)}
#deathScreen p{color:#cbb;font-size:14px}
#vig{position:fixed;inset:0;pointer-events:none;z-index:40;background:radial-gradient(ellipse at center,transparent 62%,rgba(0,0,0,.5) 100%)}
#hurtFlash{position:fixed;inset:0;pointer-events:none;z-index:41;background:radial-gradient(ellipse at center,transparent 55%,rgba(200,0,0,.45) 100%);opacity:0;transition:opacity .1s}
@media (min-width:760px){#questTracker{width:196px}}
</style>
</head>
<body>
<div id="game"></div>
<div id="vig"></div><div id="hurtFlash"></div>

<div id="startScreen">
  <h1>晨星大陆</h1>
  <div class="sub">D A W N S T A R · 竖 屏 3 D · M M O R P G</div>
  <input id="nameInput" maxlength="8" placeholder="输入你的名字">
  <div class="clsRow" id="clsRow"></div>
  <div id="clsDesc" class="panel"></div>
  <div id="startBtns">
    <button class="btn" id="bigStart">踏入晨星大陆</button>
    <button class="btn2" id="continueBtn" style="display:none">继续冒险</button>
  </div>
  <div id="startTip">选择职业 → 在晨星村接任务 → 草原、墓地、强盗营地一路打上去 → 深入洞穴讨伐食人魔王。<br>大陆上还有其他「玩家」与你一起冒险（离线模拟）。进度自动保存在本机。</div>
</div>

<div id="hud">
  <div id="plateLayer"></div><div id="dmgLayer"></div>
  <div id="playerFrame">
    <div class="nm"><span id="pfName">冒险者</span><span class="lv" id="pfLv">1 级</span></div>
    <div class="bar"><i id="hpFill"></i><span id="hpText"></span></div>
    <div class="bar mp"><i id="mpFill"></i><span id="mpText"></span></div>
    <div id="resText">怒气 0</div>
    <div class="bar xp"><i id="xpFill"></i><span></span></div>
  </div>
  <div id="targetFrame">
    <div class="nm"><span id="tfName">目标</span><span class="lv gold" id="tfLv"></span></div>
    <div class="bar hp2"><i id="tfFill"></i><span id="tfText"></span></div>
  </div>
  <div id="bossBar"><div class="nm" id="bossName">BOSS</div><div class="bar hp2"><i id="bossFill"></i><span id="bossText"></span></div></div>
  <div id="topRight">
    <canvas id="minimap" width="208" height="208"></canvas>
    <div id="sysBtns">
      <button class="sysBtn" id="btnChar" title="角色">🧙</button>
      <button class="sysBtn" id="btnBag" title="背包">🎒<span class="bdg" id="bagBdg" style="display:none"></span></button>
      <button class="sysBtn" id="btnQuest" title="任务">📜<span class="bdg" id="questBdg" style="display:none"></span></button>
      <button class="sysBtn" id="btnSound" title="声音">🔊</button>
    </div>
  </div>
  <div id="zoneName">晨星村</div>
  <div id="questTracker"><h4>任务追踪</h4><div id="qtBody"><div class="q"><span class="p">去村口找村长接任务</span></div></div></div>
  <div id="chatLog"></div>
  <div id="toast"></div><div id="lootToast"></div>
  <div id="castBar"><div class="lb" id="castName">施法</div><div class="bar"><i id="castFill"></i></div></div>
  <div id="joyBase"><div id="joyStick"></div></div>
  <div id="midBtns">
    <button class="midBtn" id="btnInteract" style="display:none">对话</button>
    <button class="midBtn" id="btnTarget">选<br>目标</button>
  </div>
  <div id="skillCluster"></div>
</div>

<div class="sheet panel" id="bagSheet"><h3>背包 <span class="x" data-close="bagSheet">✕</span></h3><div id="bagGrid"></div><div id="moneyRow"></div><div style="font-size:11.5px" class="dim">点物品：装备 / 使用 / 出售（出售价为买价的 40%）</div></div>
<div class="sheet panel" id="charSheet"><h3>角色 <span class="x" data-close="charSheet">✕</span></h3><div class="eqRow" id="eqRow"></div><div class="statGrid" id="statGrid"></div><div id="talentList" style="margin-top:10px;font-size:12.5px;line-height:1.7"></div></div>
<div class="sheet panel" id="questSheet"><h3>任务日志 <span class="x" data-close="questSheet">✕</span></h3><div id="questList"></div></div>
<div class="sheet panel" id="dialogSheet"><h3><span id="dlgName">NPC</span> <span class="x" data-close="dialogSheet">✕</span></h3><div class="npcSay" id="dlgText"></div><div class="dlgBtns" id="dlgBtns"></div></div>
<div class="sheet panel" id="shopSheet"><h3><span id="shopName">商店</span> <span class="x" data-close="shopSheet">✕</span></h3><div id="shopList"></div><div id="shopMoney" style="margin-top:9px"></div></div>
<div class="sheet panel" id="talentSheet"><h3 style="justify-content:center">✦ 升级！选择一项天赋 ✦</h3><div class="talRow" id="talRow"></div></div>

<div id="deathScreen"><h2>你 已 阵 亡</h2><p id="deathText">灵魂回到了晨星村墓地……</p><button class="btn" id="btnRespawn">在村庄复活</button></div>

<script>
'use strict';
/* ================= 工具 ================= */
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const rnd=(a,b)=>a+Math.random()*(b-a);
const irnd=(a,b)=>Math.floor(rnd(a,b+1));
const pick=arr=>arr[Math.floor(Math.random()*arr.length)];
const dist=(a,b)=>Math.hypot(a.x-b.x,a.z-b.z);
const fmtN=n=>n>=10000?(n/1000).toFixed(1)+'k':''+Math.floor(n);
function fmtMoney(c){c=Math.floor(c);const g=Math.floor(c/10000),s=Math.floor(c%10000/100),k=c%100;let t='';if(g)t+=g+' 金 ';if(s||g)t+=s+' 银 ';return t+k+' 铜';}
function angleLerp(a,b,t){let d=(b-a)%(Math.PI*2);if(d>Math.PI)d-=Math.PI*2;if(d<-Math.PI)d+=Math.PI*2;return a+d*t;}
/* ================= 音效（WebAudio 合成） ================= */
let AC=null,muted=false;

const WORLD_R=195;
function groundH(x,z){
 let h=Math.sin(x*0.021)*Math.cos(z*0.019)*2.2+Math.sin(x*0.006+1.3)*Math.cos(z*0.008)*3.2;
 const dv=Math.hypot(x,z);if(dv<30)h*=dv/30*0.25;
 const dc=Math.hypot(x-118,z+118);if(dc<30)h*=Math.max(0.12,dc/30);
 const dg=Math.hypot(x+88,z-6);if(dg<26)h*=Math.max(0.2,dg/26);
 return h;
}

function addCollider(x,z,r){colliders.push({x,z,r});}
function collide(pos,r){

 const d=Math.hypot(pos.x,pos.z);if(d>WORLD_R){pos.x*=WORLD_R/d;pos.z*=WORLD_R/d;}
}

function recalc(p){
 const C=CLASSES[p.cls],L=p.lvl-1;
 let atk=C.base.atk+C.grow.atk*L,armor=C.base.armor+C.grow.armor*L,hp=C.base.hp+C.grow.hp*L;
 for(const s of['weapon','armor','trinket']){const it=p.eq[s];if(it){atk+=it.atk||0;armor+=it.armor||0;hp+=it.hp||0;}}
 const oldMax=p.maxhp||hp;
 p.atk=Math.round(atk*(1+p.tal.atk));p.armor=Math.round(armor*(1+p.tal.armor));
 p.maxhp=Math.round(hp*(1+p.tal.hp));p.spd=C.base.spd*(1+p.tal.spd);
 if(p.hp&&oldMax!==p.maxhp)p.hp=Math.min(p.maxhp,Math.round(p.hp*p.maxhp/oldMax));
 p.crit=0.12+p.tal.crit;
}

 if(!el){if(platePool.length>=26)return null;el={div:document.createElement('div')};el.div.className='plate';el.div.innerHTML='<div class="mark"></div><div class="nm"></div><div class="pb"><i></i></div>';$('plateLayer').appendChild(el.div);platePool.push(el);}
 el.on=true;el.div.style.display='block';return el;
}
function updatePlates(){
 platePool.forEach(p=>{p.on=false;p.div.style.display='none';});
 function show(ent,mark,friendly){
  if(!ent.alive)return;const d=dist(player.pos,ent.pos);if(d>34)return;
  const el=getPlate();if(!el)return;
  el.div.querySelector('.mark').textContent=mark||'';
  el.div.querySelector('.nm').innerHTML='<span class="lv">'+ent.lvl+'</span> '+ent.name;
  el.div.querySelector('.pb>i').style.width=clamp(ent.hp/ent.maxhp*100,0,100)+'%';
  el.div.className='plate'+(friendly?' friendly':'');
  const v=ent.pos.clone();v.y+= (ent.boss?4.6:2.5);v.project(camera);
  el.div.style.left=((v.x*0.5+0.5)*innerWidth)+'px';el.div.style.top=((-v.y*0.5+0.5)*innerHeight)+'px';
 }
 for(const m of mobs)show(m,questMarkFor(m),'');
 for(const b of bots)show(b,'',true);
 for(const n of npcMeshes){const q=questMarkNPC(n.def.id);show({alive:true,pos:n.pos,lvl:'',name:n.def.name,hp:1,maxhp:1},q,true);}
 if(player.target&&player.target.alive)show(player.target,'','');
}
function questMarkNPC(npcId){
 let ready=false,avail=false;
 for(const q of QUESTS){if(q.giver!==npcId)continue;
  if(player.quests[q.id]&&player.quests[q.id].prog>=(q.count||1))ready=true;
  else if(!player.quests[q.id]&&!player.doneQuests[q.id]&&player.lvl>=q.minLvl)avail=true;}
 return ready?'?':avail?'!':'';
}
function questMarkFor(m){for(const q of QUESTS){const st=player.quests[q.id];if(st&&q.type==='kill'&&q.target===m.type&&st.prog<q.count)return '◆';}return '';}
/* ================= 粒子与投射物 ================= */
const partGeo=new THREE.BoxGeometry(0.14,0.14,0.14);
function burst(pos,color,n,spd,life,size){
 for(let i=0;i<(n||10);i++){const m=new THREE.Mesh(partGeo,new THREE.MeshBasicMaterial({color}));m.scale.setScalar(size||1);
  m.position.copy(pos);scene.add(m);
  particles.push({mesh:m,vx:rnd(-1,1)*(spd||3),vy:rnd(1,2.4)*(spd||3)*0.6,vz:rnd(-1,1)*(spd||3),t:0,life:life||0.55});}
}
function updateParticles(dt){
 for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.t+=dt;
  if(p.t>=p.life){scene.remove(p.mesh);p.mesh.material.dispose();particles.splice(i,1);continue;}
  p.vy-=9*dt;p.mesh.position.x+=p.vx*dt;p.mesh.position.y+=p.vy*dt;p.mesh.position.z+=p.vz*dt;
  p.mesh.material.opacity=1-p.t/p.life;p.mesh.material.transparent=true;p.mesh.rotation.x+=dt*4;}
}
function fireProjectile(from,to,color,onHit,spd){
 const m=new THREE.Mesh(new THREE.SphereGeometry(0.22,8,8),new THREE.MeshBasicMaterial({color}));
 m.position.copy(from);scene.add(m);
 projectiles.push({mesh:m,target:to,onHit,t:0,spd:spd||26,from:from.clone()});
 burst(from,color,3,1.2,0.3,0.7);
}
function updateProjectiles(dt){
 for(let i=projectiles.length-1;i>=0;i--){const pr=projectiles[i];pr.t+=dt;
  const tp=pr.target&&pr.target.alive?pr.target.pos.clone().setY(pr.target.pos.y+1.2):null;
  if(!tp||pr.t>2.4){scene.remove(pr.mesh);projectiles.splice(i,1);if(tp&&pr.t<=2.4)pr.onHit&&pr.onHit();continue;}
  const d=tp.clone().sub(pr.mesh.position),len=d.length();
  if(len<0.9){scene.remove(pr.mesh);projectiles.splice(i,1);pr.onHit&&pr.onHit();continue;}
  pr.mesh.position.add(d.normalize().multiplyScalar(pr.spd*dt));}
}
/* ================= 战斗 ================= */
function armorReduce(armor,lvl){return armor/(armor+55+9*lvl);}
function dealDamage(src,tgt,mult,opt){
 opt=opt||{};if(!tgt||!tgt.alive)return 0;
 if(tgt.kind==='player'&&tgt.dead)return 0;
 let dmg=(src.atk||10)*mult*rnd(0.9,1.1);
 if(src.kind==='player'&&src.buffAtkT>0)dmg*=1.35;
 let crit=Math.random()<(src.crit||0.1);if(crit)dmg*=1.8;
 dmg*=1-armorReduce(tgt.armor||0,tgt.lvl||1);dmg=Math.max(1,Math.round(dmg));
 tgt.hp-=dmg;tgt.hitFlash=0.12;
 if(tgt.kind==='mob'){tgt.threat=src;tgt.state='aggro';}
 const tp=tgt.pos.clone();tp.y+=tgt.boss?3.4:2;
 if(src.kind==='player')floatText(tp,(crit?'暴击 ':'')+dmg,crit?'crit':'');
 else if(tgt.kind==='player'){floatText(tp,'-'+dmg,'player');hurtFx();}
 if(src.kind==='player'&&player.tal.life>0)heal(player,Math.round(dmg*player.tal.life),true);
 if(tgt.hp<=0)kill(src,tgt);
 return dmg;
}
function heal(ent,amt,silent){if(!ent.alive)return;ent.hp=Math.min(ent.maxhp,ent.hp+amt);if(ent.kind==='player'&&!silent)floatText(ent.pos.clone().setY(ent.pos.y+2.2),'+'+amt,'heal');}
function hurtFx(){const f=$('hurtFlash');f.style.opacity=1;setTimeout(()=>f.style.opacity=0,130);}
function kill(src,tgt){
 tgt.alive=false;tgt.hp=0;
 if(tgt.kind==='mob'){
  tgt.mesh.rotation.x=-Math.PI/2;tgt.mesh.position.y=groundH(tgt.pos.x,tgt.pos.z)+0.25;tgt.respawnT=tgt.boss?9999:14;
  burst(tgt.pos.clone().setY(tgt.pos.y+1),0xffd100,10,3,0.6);
  if(src.kind==='player'||src.kind==='bot'&&src.nearPlayer){/* 经验在下方统一 */}
  if(src.kind==='player'){
   gainXP(tgt.xp);const c=irnd(tgt.coin[0],tgt.coin[1]);player.coin+=c;SFX.coin();
   lootToast(tgt.name+' 被击败 · +'+tgt.xp+' 经验 · '+fmtMoney(c));
   if(Math.random()<0.30)dropItem(tgt);
   if(Math.random()<0.22){player.potions++;toast('拾取：治疗药水 ×1','');}
   questProgress('kill',tgt.type);
   if(tgt.boss)onBossKilled();
   if(player.target===tgt)player.target=null;
  }else if(src.kind==='bot'){chatSay('l',src.name+' 击败了 '+tgt.name);}
 }else if(tgt.kind==='bot'){tgt.mesh.rotation.x=-Math.PI/2;tgt.respawnT=10;chatSay('l',tgt.name+' 被 '+ (src.name||'敌人') +' 击败，回村复活了');}
 else if(tgt.kind==='player'){onPlayerDeath(src);}
}
function dropItem(mob){
 const r=Math.random();const rar=mob.elite||mob.boss?(r<0.4?3:r<0.75?2:1):(r<0.05?3:r<0.2?2:r<0.5?1:0);
 const slot=pick(['weapon','armor','trinket','armor','weapon']);
 if(mob.boss){const it=makeItem('equip','weapon',mob.lvl,4,player.cls);addToBag(it);lootToast('✦ 传说掉落：'+it.name+' ✦');SFX.quest();return;}
 const it=slot&&Math.random()<0.7?makeItem('equip',slot,mob.lvl,rar,player.cls):makeItem('junk');
 addToBag(it);lootToast('掉落：'+it.name+'（'+RARITY[it.rarity||0].n+'）');
}
function addToBag(it){if(player.bag.length>=36){toast('背包已满！','去商人那里卖掉些东西');return false;}player.bag.push(it);updateBagBadge();return true;}
function gainXP(n){
 n=Math.round(n*(1+player.tal.xp));player.xp+=n;
 while(player.xp>=xpNeed(player.lvl)&&player.lvl<20){player.xp-=xpNeed(player.lvl);player.lvl++;onLevelUp();}
 recalc(player);
}
function onLevelUp(){
 SFX.lvl();burst(player.pos.clone().setY(player.pos.y+1),0xffd100,26,4,0.9,1.3);
 toast('升 级 ！','你达到了 '+player.lvl+' 级');player.hp=player.maxhp;if(player.cls!=='warrior')player.res=100;
 chatSay('s','恭喜 '+player.name+' 升到了 '+player.lvl+' 级！');
 const pool=TALENTS.filter(t=>true);const opts=[];while(opts.length<3){const t=pick(pool);if(!opts.includes(t))opts.push(t);}
 const row=$('talRow');row.innerHTML='';
 opts.forEach(t=>{const d=document.createElement('div');d.className='talCard';d.innerHTML='<div class="t">'+t.t+'</div><div class="d">'+t.d+'</div>';
  d.onclick=()=>{t.apply(player);recalc(player);$('talentSheet').style.display='none';SFX.quest();saveGame();};row.appendChild(d);});
 $('talentSheet').style.display='block';

/* ================= 技能 ================= */
function skillReady(sk){return player.lvl>=(sk.unlock||1)&&(!player.cds[sk.id]||player.cds[sk.id]<=0);}
function useSkill(idx){
 const sk=CLASSES[player.cls].skills[idx];if(!sk||player.dead||player.cast)return;
 if(player.lvl<(sk.unlock||1)){toast('未解锁','达到 '+(sk.unlock)+' 级解锁「'+sk.name+'」');SFX.error();return;}
 if(player.cds[sk.id]>0)return;
 if(player.cls==='warrior'&&player.res<sk.cost){toast('怒气不足','','');SFX.error();return;}
 if(player.cls!=='warrior'&&player.res<sk.cost){toast(player.cls==='mage'?'法力不足':'能量不足');SFX.error();return;}
 /* 目标校验 */
 let tgt=player.target;
 const needTarget=['dmg','proj','dot','charge'].includes(sk.kind);
 if(needTarget&&(!tgt||!tgt.alive||dist(player.pos,tgt.pos)>sk.range+3)){
  tgt=nearestMob(sk.range+3);if(tgt)player.target=tgt;
  if(!tgt){toast('没有目标','附近没有可攻击的敌人');SFX.error();return;}}
 if(sk.kind==='multi'&&!nearestMob(sk.range+3)){toast('没有目标','附近没有可攻击的敌人');return;}
 if(sk.kind==='aoeTarget'&&(!tgt||!tgt.alive)){tgt=nearestMob(sk.range+3);if(!tgt){toast('没有目标');return;}player.target=tgt;}
 const exec=()=>{execSkill(sk,tgt);};
 if(sk.cast){player.cast={sk,tgt,t:0,dur:sk.cast,exec};SFX.cast();}
 else exec();
}
function payCost(sk){player.res=clamp(player.res-sk.cost,0,100);player.cds[sk.id]=sk.cd*(1-player.tal.cd);if(player.cls==='warrior')player.combatT=5;}
function execSkill(sk,tgt){
 payCost(sk);
 const P=player.mesh.userData.parts;
 if(P){P.armR.rotation.x=-2.2;setTimeout(()=>{if(P.armR)P.armR.rotation.x=0;},220);}
 player.face=tgt&&sk.kind!=='aoe'&&sk.kind!=='buff'&&sk.kind!=='buffSpeed'&&sk.kind!=='blink'?Math.atan2(tgt.pos.x-player.pos.x,tgt.pos.z-player.pos.z):player.face;
 if(sk.kind==='dmg'){SFX.swing();dealDamage(player,tgt,sk.mult);if(player.cls==='warrior')player.res=clamp(player.res+8,0,100);}
 else if(sk.kind==='aoe'){SFX.boom();burst(player.pos.clone().setY(player.pos.y+1),0xffc44d,14,4,0.5);
  mobs.forEach(m=>{if(m.alive&&dist(player.pos,m.pos)<=sk.range)dealDamage(player,m,sk.mult);if(sk.slow&&m.alive&&dist(player.pos,m.pos)<=sk.range){m.slow=sk.slow;m.slowT=sk.slowDur;}});}
 else if(sk.kind==='proj'){SFX.cast();const from=player.pos.clone();from.y+=1.6;
  fireProjectile(from,tgt,sk.color||0xffffff,m=>{if(tgt.alive){dealDamage(player,tgt,sk.mult);if(sk.slow){tgt.slow=sk.slow;tgt.slowT=sk.slowDur;}burst(tgt.pos.clone().setY(tgt.pos.y+1),sk.color||0xffffff,8,2.6,0.4);}});}
 else if(sk.kind==='multi'){SFX.swing();const list=mobs.filter(m=>m.alive&&dist(player.pos,m.pos)<=sk.range).sort((a,b)=>dist(player.pos,a.pos)-dist(player.pos,b.pos)).slice(0,3);
  list.forEach((m,i)=>setTimeout(()=>{if(m.alive)fireProjectile(player.pos.clone().setY(player.pos.y+1.6),m,sk.color||0xd8ffb0,()=>{if(m.alive)dealDamage(player,m,sk.mult);});},i*110));}
 else if(sk.kind==='dot'){SFX.cast();fireProjectile(player.pos.clone().setY(player.pos.y+1.6),tgt,0x7aff5a,()=>{if(tgt.alive){dealDamage(player,tgt,sk.mult);tgt.dots.push({t:sk.dotDur,mult:sk.dotMult,src:player,tick:0});}});}
 else if(sk.kind==='charge'){SFX.boom();const d=dist(player.pos,tgt.pos);const dir={x:(tgt.pos.x-player.pos.x)/d,z:(tgt.pos.z-player.pos.z)/d};
  player.pos.x=tgt.pos.x-dir.x*2.1;player.pos.z=tgt.pos.z-dir.z*2.1;burst(player.pos.clone().setY(player.pos.y+0.8),0xffffff,8,2.4,0.35);
  dealDamage(player,tgt,sk.mult);tgt.stun=Math.max(tgt.stun,sk.stun||0);}
 else if(sk.kind==='blink'){SFX.pick();const fx=Math.sin(player.face),fz=Math.cos(player.face);
  burst(player.pos.clone().setY(player.pos.y+1),0x7ad8ff,12,2.4,0.4);
  player.pos.x+=fx*9;player.pos.z+=fz*9;collide(player.pos,0.6);
  mobs.forEach(m=>{if(m.threat===player)m.threat=null;if(m.state==='aggro'&&dist(m.pos,player.pos)>m.aggroR+6)m.state='return';});}
 else if(sk.kind==='buff'){player.buffAtkT=15;burst(player.pos.clone().setY(player.pos.y+1.2),0xff5a2a,16,3,0.6);toast('狂暴之怒','攻击提升 35%，持续 15 秒');}
 else if(sk.kind==='buffSpeed'){player.speedBuffT=8;burst(player.pos.clone().setY(player.pos.y+1),0x8aff8a,10,2.4,0.4);}
 else if(sk.kind==='aoeTarget'){SFX.boom();const cx=tgt.pos.x,cz=tgt.pos.z;
  for(let i=0;i<7;i++)setTimeout(()=>{const p=new THREE.Vector3(cx+rnd(-2.4,2.4),groundH(cx,cz)+0.4,cz+rnd(-2.4,2.4));burst(p,0xd8ffb0,4,2,0.35,0.8);},i*90);
  mobs.forEach(m=>{if(m.alive&&Math.hypot(m.pos.x-cx,m.pos.z-cz)<=4.6)setTimeout(()=>{if(m.alive)dealDamage(player,m,sk.mult);},380);});}
 updateHUD();
}
function nearestMob(range){let best=null,bd=range||30;for(const m of mobs){if(!m.alive)continue;const d=dist(player.pos,m.pos);if(d<bd){bd=d;best=m;}}return best;}
function cycleTarget(){const list=mobs.filter(m=>m.alive&&dist(player.pos,m.pos)<34).sort((a,b)=>dist(player.pos,a.pos)-dist(player.pos,b.pos));
 if(!list.length){player.target=null;return;}const i=list.indexOf(player.target);player.target=list[(i+1)%list.length];SFX.pick();updateHUD();}
/* ================= 任务逻辑 ================= */
function questProgress(type,target){
 for(const q of QUESTS){const st=player.quests[q.id];if(!st||st.prog>=q.count)continue;
  if(q.type===type&&q.target===target){st.prog++;SFX.pick();
   if(st.prog>=q.count){toast('任务完成：'+q.name,'回去找'+npcName(q.giver)+'领取奖励');chatSay('s',player.name+' 完成了任务「'+q.name+'」');}
   else toast(q.name,'进度 '+st.prog+' / '+q.count);
   updateTracker();saveGame();}}
}
function npcName(id){const n=NPCS.find(n=>n.id===id);return n?n.name:id;}
function acceptQuest(q){player.quests[q.id]={prog:0};SFX.quest();toast('新任务：'+q.name,q.text);updateTracker();updateQuestBadge();saveGame();}
function turnInQuest(q){
 const st=player.quests[q.id];if(!st||st.prog<q.count)return;
 delete player.quests[q.id];player.doneQuests[q.id]=1;const r=q.reward;
 gainXP(r.xp||0);player.coin+=r.coin||0;SFX.quest();
 let extra='';
 if(r.item){const it=makeItem(r.item);if(addToBag(it))extra=' · 获得 '+it.name;}
 if(r.equip){const it=makeItem('equip',pick(['weapon','armor','trinket']),player.lvl,Math.min(4,r.equip),player.cls);addToBag(it);extra=' · 获得 '+it.name+'（'+RARITY[it.rarity].n+'）';}
 toast('任务完成！','+'+(r.xp||0)+' 经验 · '+fmtMoney(r.coin||0)+extra);updateTracker();updateQuestBadge();saveGame();
}

/* ================= 怪物 AI ================= */
function animEnt(ent,dt,moving){
 const P=ent.mesh.userData.parts;if(!P)return;
 if(moving){ent.walkPh+=dt*9;const s=Math.sin(ent.walkPh)*0.55;
  if(P.legL)P.legL.rotation.x=s;if(P.legR)P.legR.rotation.x=-s;
  if(P.legL2)P.legL2.rotation.x=-s;if(P.legR2)P.legR2.rotation.x=s;
  if(P.armL&&ent.kind!=='mob')P.armL.rotation.x=-s*0.7;if(P.armR&&ent.kind!=='mob'&&ent.atkT<=0)P.armR.rotation.x=s*0.7;}
 else{if(P.legL)P.legL.rotation.x*=0.8;if(P.legR)P.legR.rotation.x*=0.8;if(P.legL2)P.legL2.rotation.x*=0.8;if(P.legR2)P.legR2.rotation.x*=0.8;
  if(P.armL)P.armL.rotation.x=Math.sin(performance.now()*0.0016+ent.walkPh)*0.06;}
 if(ent.atkT>0){ent.atkT-=dt;if(P.armR)P.armR.rotation.x=-2+ (0.22-ent.atkT)*6;}
 ent.mesh.position.set(ent.pos.x,groundH(ent.pos.x,ent.pos.z),ent.pos.z);
 ent.mesh.rotation.y=angleLerp(ent.mesh.rotation.y,ent.face,0.25);
 if(ent.hitFlash>0){ent.hitFlash-=dt;ent.mesh.traverse(m=>{if(m.isMesh&&m.material.emissive)m.material.emissive.setHex(ent.hitFlash>0?0x661111:0x000000);});}
}
function moveToward(ent,tx,tz,dt,spdMul){
 const dx=tx-ent.pos.x,dz=tz-ent.pos.z,d=Math.hypot(dx,dz);if(d<0.1)return false;
 ent.face=Math.atan2(dx,dz);const sp=ent.spd*(spdMul||1)*(ent.slowT>0?1-ent.slow:1);
 const step=Math.min(d,sp*dt);ent.pos.x+=dx/d*step;ent.pos.z+=dz/d*step;collide(ent.pos,0.55);return d>1.6;
}
function updateMob(m,dt){
 if(!m.alive){if(m.respawnT<9000){m.respawnT-=dt;if(m.respawnT<=0){m.alive=true;m.hp=m.maxhp;m.pos.set(m.home.x,0,m.home.z);m.mesh.rotation.x=0;m.state='idle';m.threat=null;}}return;}
 /* DoT */
 for(let i=m.dots.length-1;i>=0;i--){const d=m.dots[i];d.t-=dt;d.tick-=dt;if(d.tick<=0){d.tick=1;dealDamage(d.src,m,d.mult,{dot:true});}if(d.t<=0||!m.alive)m.dots.splice(i,1);}
 if(!m.alive)return;
 if(m.slowT>0)m.slowT-=dt;if(m.stun>0){m.stun-=dt;animEnt(m,dt,false);return;}
 /* 仇恨判定 */
 if(m.state!=='aggro'){
  if(player.alive&&!player.dead&&dist(m.pos,player.pos)<m.aggroR&&Math.abs(player.lvl-m.lvl)<9){m.threat=player;m.state='aggro';}
 }
 const t=m.threat;
 if(t&&t.kind==='player'&&t.dead){m.threat=null;m.state='return';}
 if(m.state==='aggro'&&t&&t.alive&&!(t.kind==='player'&&t.dead)){
  const d=dist(m.pos,t.pos);
  if(dist(m.pos,m.home)>46&&!m.boss){m.state='return';m.threat=null;}
  else{
   if(m.boss)bossAI(m,dt,t);
   if(d>(m.boss?3.4:2.2)){moveToward(m,t.pos.x,t.pos.z,dt,1);animEnt(m,dt,true);}
   else{m.face=Math.atan2(t.pos.x-m.pos.x,t.pos.z-m.pos.z);animEnt(m,dt,false);
    m.atkCd=(m.atkCd||0)-dt;
    if(m.atkCd<=0){m.atkCd=rnd(1.1,1.5);m.atkT=0.22;dealDamage(m,t,rnd(0.85,1.15));if(m.type==='priest')burst(t.pos.clone().setY(t.pos.y+1),0xc07dff,5,2,0.35);}}
  }

let joy={active:false,id:null,x:0,y:0};
let camYaw=Math.PI,camPitch=0.46,camFreeT=0,dragP=null,tapInfo=null;
const keys={};
function isUI(e){return e.target.closest('button')||e.target.closest('.sheet')||e.target.closest('#startScreen')||e.target.tagName==='INPUT'||e.target.closest('#sysBtns');}
window.addEventListener('pointerdown',e=>{
 if(!player||isUI(e))return;
 const jr=$('joyBase').getBoundingClientRect();const jcx=jr.left+jr.width/2,jcy=jr.top+jr.height/2;
 if(Math.hypot(e.clientX-jcx,e.clientY-jcy)<95){joy.active=true;joy.id=e.pointerId;joyMove(e);return;}
 dragP={id:e.pointerId,x:e.clientX,y:e.clientY};tapInfo={t:performance.now(),x:e.clientX,y:e.clientY};
});
window.addEventListener('pointermove',e=>{
 if(joy.active&&e.pointerId===joy.id){joyMove(e);return;}
 if(dragP&&e.pointerId===dragP.id){camYaw-=(e.clientX-dragP.x)*0.0052;camPitch=clamp(camPitch+(e.clientY-dragP.y)*0.003,0.18,0.95);dragP.x=e.clientX;dragP.y=e.clientY;camFreeT=2.6;}
});
function joyMove(e){const jr=$('joyBase').getBoundingClientRect();const jcx=jr.left+jr.width/2,jcy=jr.top+jr.height/2;
 let dx=e.clientX-jcx,dy=e.clientY-jcy;const d=Math.hypot(dx,dy),max=42;if(d>max){dx*=max/d;dy*=max/d;}
 joy.x=dx/max;joy.y=dy/max;$('joyStick').style.transform='translate('+dx+'px,'+dy+'px)';}
function endPointer(e){
 if(joy.active&&e.pointerId===joy.id){joy.active=false;joy.x=0;joy.y=0;$('joyStick').style.transform='';}
 if(dragP&&e.pointerId===dragP.id){dragP=null;
  if(tapInfo&&performance.now()-tapInfo.t<260&&player)tapSelect(tapInfo.x,tapInfo.y);tapInfo=null;}
}
window.addEventListener('pointerup',endPointer);window.addEventListener('pointercancel',endPointer);
const raycaster=new THREE.Raycaster();const clickables=[];
function tapSelect(cx,cy){
 const ndc=new THREE.Vector2(cx/innerWidth*2-1,-(cy/innerHeight)*2+1);raycaster.setFromCamera(ndc,camera);
 const hits=raycaster.intersectObjects(clickables,true);if(!hits.length)return;
 let o=hits[0].object;while(o){if(o.userData.ent||o.userData.npc)break;o=o.parent;}
 if(!o)return;
 if(o.userData.ent){const ent=o.userData.ent;
  if(ent.kind==='mob'){player.target=ent;SFX.pick();updateHUD();}
  else if(ent.kind==='bot'){toast(ent.name+' · '+CLASSES[ent.cls].name,ent.lvl+' 级 · 生命 '+Math.round(ent.hp/ent.maxhp*100)+'%');}}
 else if(o.userData.npc){const n=o.userData.npc;
  if(dist(player.pos,n.pos)<5)openDialog(n);else toast('太远了','走近一点再和 '+n.def.name+' 说话');}
}

 if(!player)return;
 if(e.code==='Tab'){e.preventDefault();cycleTarget();}
 if(e.code.startsWith('Digit')){const n=+e.code.slice(5);if(n>=1&&n<=5)useSkill(n-1);}
 if(e.code==='Space'){e.preventDefault();$('btnInteract').click();}
 if(e.code==='KeyR')usePotion();
 if(e.code==='KeyB')$('btnBag').click();if(e.code==='KeyC')$('btnChar').click();if(e.code==='KeyQ')$('btnQuest').click();});
window.addEventListener('keyup',e=>keys[e.code]=false);
document.addEventListener('touchmove',e=>{if(!e.target.closest('.sheet')&&!e.target.closest('#startScreen'))e.preventDefault();},{passive:false});
document.addEventListener('contextmenu',e=>e.preventDefault());
/* ================= 玩家更新 ================= */
function updatePlayer(dt){
 const p=player;if(p.dead){p.mesh.visible=false;return;}p.mesh.visible=true;
 for(const k in p.cds)if(p.cds[k]>0)p.cds[k]-=dt;
 if(p.buffAtkT>0)p.buffAtkT-=dt;if(p.speedBuffT>0)p.speedBuffT-=dt;
 /* 输入方向 */
 let ix=joy.x,iy=joy.y;
 if(keys.KeyW||keys.ArrowUp)iy=-1;if(keys.KeyS||keys.ArrowDown)iy=1;if(keys.KeyA||keys.ArrowLeft)ix=-1;if(keys.KeyD||keys.ArrowRight)ix=1;
 const fwd={x:-Math.sin(camYaw),z:-Math.cos(camYaw)},rgt={x:-fwd.z,z:fwd.x};
 let mx=fwd.x*(-iy)+rgt.x*ix,mz=fwd.z*(-iy)+rgt.z*ix;const ml=Math.hypot(mx,mz);
 const moving=ml>0.18;
 if(moving){mx/=Math.max(1,ml);mz/=Math.max(1,ml);
  if(p.cast){p.cast=null;$('castBar').style.display='none';}
  const sp=p.spd*(p.speedBuffT>0?1.45:1)*(p.buffAtkT>0?1.15:1);
  p.pos.x+=mx*sp*dt;p.pos.z+=mz*sp*dt;p.face=Math.atan2(mx,mz);collide(p.pos,0.6);
  if(camFreeT<=0)camYaw=angleLerp(camYaw,p.face+Math.PI,dt*2.2);
 }
 if(camFreeT>0)camFreeT-=dt;
 /* 施法 */
 if(p.cast){const c=p.cast;c.t+=dt;$('castBar').style.display='block';$('castName').textContent=c.sk.name;
  $('castFill').style.transform='scaleX('+clamp(c.t/c.dur,0,1)+')';
  if(c.t>=c.dur){p.cast=null;$('castBar').style.display='none';c.exec();}}
 /* 自动攻击 */
 p.autoCd=(p.autoCd||0)-dt;
 const t=p.target;
 if(t&&(!t.alive||dist(p.pos,t.pos)>40))p.target=null;
 if(t&&t.alive&&!p.cast){
  const rng=p.cls==='warrior'?2.9:25,d=dist(p.pos,t.pos);
  if(d<=rng&&p.autoCd<=0){p.autoCd=p.cls==='warrior'?1.4:p.cls==='mage'?1.7:1.25;p.atkT=0.22;p.face=Math.atan2(t.pos.x-p.pos.x,t.pos.z-p.pos.z);
   if(p.cls==='warrior'){SFX.swing();dealDamage(p,t,1);p.res=clamp(p.res+9,0,100);}
   else{const col=p.cls==='mage'?0xb18cff:0xffffff;fireProjectile(p.pos.clone().setY(p.pos.y+1.6),t,col,()=>{if(t.alive)dealDamage(p,t,p.cls==='mage'?0.62:0.85);});SFX.swing();}}
 }
 /* 资源与回复 */
 const inCombat=mobs.some(m=>m.alive&&m.threat===p);
 if(p.cls==='mage')p.res=clamp(p.res+(inCombat?3.5:9)*dt,0,100);
 if(p.cls==='ranger')p.res=clamp(p.res+13*dt,0,100);
 if(p.cls==='warrior'&&!inCombat)p.res=clamp(p.res-4*dt,0,100);
 if(!inCombat&&p.hp<p.maxhp)p.hp=Math.min(p.maxhp,p.hp+p.maxhp*0.06*dt);
 animEnt(p,dt,moving);
 p.checkT=(p.checkT||0)-dt;if(p.checkT<=0){p.checkT=0.2;checkInteract();}
}
/* ================= 小地图 ================= */
const mmx=$('minimap').getContext('2d');
function drawMinimap(){
 const c=mmx;c.clearRect(0,0,208,208);c.fillStyle='#0d1420';c.fillRect(0,0,208,208);
 const sc=104/72,px=104,py=104;
 c.fillStyle='rgba(90,140,70,.35)';c.beginPath();c.arc(px,py,100,0,7);c.fill();
 function dot(e,color,r){const dx=(e.pos?e.pos.x:e.x)-player.pos.x,dz=(e.pos?e.pos.z:e.z)-player.pos.z;
  if(Math.abs(dx)>70||Math.abs(dz)>70)return;c.fillStyle=color;c.beginPath();c.arc(px+dx*sc,py+dz*sc,r,0,7);c.fill();}
 herbs.forEach(h=>{if(h.avail)dot(h,'#7affd8',2.5);});
 npcMeshes.forEach(n=>dot({pos:n.pos},'#ffd100',3.5));
 bots.forEach(b=>{if(b.alive)dot(b,'#5db9ff',3);});
 mobs.forEach(m=>{if(m.alive)dot(m,m.boss?'#c07dff':m.elite?'#ff9d45':'#ff5a4e',m.boss?6:m.elite?4:2.6);});
 c.fillStyle='#fff';c.beginPath();c.arc(px,py,4,0,7);c.fill();
 c.strokeStyle='#fff';c.beginPath();c.moveTo(px,py);c.lineTo(px+Math.sin(player.face)*10,py+Math.cos(player.face)*10);c.stroke();
 const zn=zoneName();if($('zoneName').textContent!==zn)$('zoneName').textContent=zn;
}
function zoneName(){const p=player.pos;
 if(Math.hypot(p.x-118,p.z+118)<30)return '格罗姆洞穴';
 if(Math.hypot(p.x+88,p.z-6)<32)return '低语墓地';
 if(Math.hypot(p.x-26,p.z+88)<26)return '强盗营地';
 if(Math.hypot(p.x,p.z)<28)return '晨星村';
 return '晨星草原';}
/* ================= 主循环 ================= */
let animObjs={clouds:[],flames:[],portal:null,crystals:[]};
function collectAnim(){scene.traverse(o=>{if(o.name==='cloud')animObjs.clouds.push(o);if(o.name==='flame')animObjs.flames.push(o);if(o.name==='portal')animObjs.portal=o;if(o.name==='crystal')animObjs.crystals.push(o);});}
let hudT=0;
function animate(){
 requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),0.05);const now=performance.now()*0.001;
 animObjs.clouds.forEach((c,i)=>{c.position.x+=dt*(0.5+i%3*0.2);if(c.position.x>240)c.position.x=-240;});
 animObjs.flames.forEach((f,i)=>{f.scale.setScalar(1+Math.sin(now*11+i*2)*0.16);});
 if(animObjs.portal)animObjs.portal.rotation.z+=dt*0.8;
 animObjs.crystals.forEach((c,i)=>{c.rotation.y+=dt;c.position.y+=Math.sin(now*2+i)*0.0015;});
 herbs.forEach(h=>{if(!h.avail){h.timer-=dt;if(h.timer<=0){h.avail=true;h.mesh.visible=true;}}});
 if(player){
  updatePlayer(dt);
  mobs.forEach(m=>updateMob(m,dt));
  bots.forEach(b=>updateBot(b,dt));
  updateProjectiles(dt);updateParticles(dt);updateFloats(dt);updatePlates();
  /* 镜头 */
  const cd=11.5,cp=camPitch;
  const cx=player.pos.x+Math.sin(camYaw)*cd*Math.cos(cp),cz=player.pos.z+Math.cos(camYaw)*cd*Math.cos(cp);
  let cy=player.pos.y+Math.sin(cp)*cd+1.4;cy=Math.max(cy,groundH(cx,cz)+1.6);
  camera.position.set(cx,cy,cz);camera.lookAt(player.pos.x,player.pos.y+1.7,player.pos.z);
  hudT-=dt;if(hudT<=0){hudT=0.12;updateHUD();drawMinimap();}
 }else{
  const a=now*0.05;camera.position.set(Math.sin(a)*26,13,Math.cos(a)*26);camera.lookAt(0,2,0);
 }
 renderer.render(scene,camera);
}
/* ================= 开始界面 ================= */
let selectedCls='warrior';
function buildStart(){
 const row=$('clsRow');
 Object.keys(CLASSES).forEach(k=>{const C=CLASSES[k];const d=document.createElement('div');d.className='clsCard'+(k===selectedCls?' sel':'');d.dataset.cls=k;
  d.innerHTML='<div class="ic">'+C.icon+'</div><div class="nm">'+C.name+'</div><div class="ds">❤️ '+C.base.hp+' · ⚔️ '+C.base.atk+'<br>'+C.resource+'驱动</div>';
  d.onclick=()=>{selectedCls=k;document.querySelectorAll('.clsCard').forEach(x=>x.classList.toggle('sel',x.dataset.cls===k));showClsDesc();SFX.pick();};
  row.appendChild(d);});
 showClsDesc();
 const names=['听风','星尘','小满','青岚','夜枭','白泽','流云','晨曦'];
 $('nameInput').value=SAVE?SAVE.name:pick(names)+irnd(10,99);
 if(SAVE){const b=$('continueBtn');b.style.display='block';b.textContent='继续冒险（'+SAVE.name+' · '+CLASSES[SAVE.cls].name+' '+SAVE.lvl+' 级）';}
}
function showClsDesc(){const C=CLASSES[selectedCls];
 $('clsDesc').innerHTML='<b class="gold">'+C.icon+' '+C.name+'</b> — '+C.desc+'<br><span class="dim">技能：'+C.skills.map(s=>s.name).join(' · ')+'</span>';}
function startGame(fromSave){
 const name=($('nameInput').value||'').trim()||'无名侠客';
 player=createPlayer(fromSave&&SAVE?SAVE.name:name,fromSave&&SAVE?SAVE.cls:selectedCls,fromSave?SAVE:null);
 mobs.forEach(m=>{m.mesh.userData.ent=m;clickables.push(m.mesh);});
 bots.forEach(b=>{b.mesh.userData.ent=b;clickables.push(b.mesh);});
 npcMeshes.forEach(n=>{n.mesh.userData.npc=n;clickables.push(n.mesh);});
 $('startScreen').style.display='none';$('hud').style.display='block';
 buildSkillBar();updateHUD();updateTracker();updateQuestBadge();recalc(player);
 camYaw=player.face+Math.PI;
 chatSay('s','欢迎来到晨星大陆，'+player.name+'！');
 setTimeout(()=>chatSay('w',pick(BOT_DEFS).n+'：'+pick(GREET_LINES)),900);
 setTimeout(()=>chatSay('w',pick(BOT_DEFS).n+'：'+pick(CHAT_LINES)),20000);
 toast('晨星大陆','去村里找头顶 ! 的村长接第一个任务');
 if(document.documentElement.requestFullscreen)document.documentElement.requestFullscreen().catch(()=>{});
 saveGame();
}
$('bigStart').onclick=()=>startGame(false);
$('continueBtn').onclick=()=>startGame(true);
/* ================= 启动 ================= */
buildWorld();buildSpawns();buildNPCs();buildBots();collectAnim();buildStart();animate();
</script>
